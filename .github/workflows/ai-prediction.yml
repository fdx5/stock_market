name: AI 종목예측 batch

# Fires the prediction batch in each market's own evening, hours after that market's
# close. Separate schedules per region, because the two closes are ~14 hours apart and
# each run only makes sense once its own market has actually stopped trading.
#
# Weekday slot — 23:00 local, the session that closed earlier the same day:
#
#   14:00 UTC = 23:00 KST (Mon-Fri)  -> KOSPI/KOSDAQ
#   03:00 UTC = 23:00 ET during EDT / 04:00 UTC = 23:00 ET during EST (Tue-Sat UTC,
#   because 23:00 ET is already the next UTC day)
#
# Sunday slot — 22:00 local, and it always runs, with force=true. No new session has
# closed since Friday, so without forcing, `has_run` would return "skipped" every week
# and the slot would only ever do something after a Friday failure. Forced, it
# re-collects and re-scores Friday's session (upsert per (수집일자, 종목코드), so
# Friday's rows are refreshed, not duplicated) and doubles as the recovery path when
# Friday's own run never landed.
#
#   13:00 UTC Sun = 22:00 KST Sun     -> KOSPI/KOSDAQ
#   02:00 UTC Mon = 22:00 ET Sun during EDT / 03:00 UTC Mon = 22:00 ET Sun during EST
#
# Saturday has no slot at all, in either region.
#
# GitHub cron has no timezone support — schedules are always UTC — so every US slot is
# listed at both offsets to cover standard and daylight time, and half the year the
# wrong one of each pair fires an hour off (including at 00:00 ET Saturday). That used
# to be harmless because `has_run` absorbed the duplicate, but a forced Sunday run has
# no such guard and would do the work twice. So the job's first step checks the fired
# cron against the market's own wall clock and exits unless the local hour is the
# intended one — see "Resolve region and slot" below. That check, not the cron DOW
# fields, is what actually keeps Saturday and double-firings out.
#
# Caveats inherited from GitHub's scheduler, same as keep-alive.yml: scheduled
# workflows are disabled after 60 days with no commits to the repo, and firing can be
# delayed several minutes under GitHub-wide load — a delay past the hour boundary now
# means the local-hour check drops that firing. The backend runs the same two slots
# in-process as a second trigger for exactly these cases — see
# prediction_batch.start_scheduler.

on:
  schedule:
    - cron: "0 14 * * 1-5"  # 23:00 KST, Mon-Fri (KST has no DST)
    - cron: "0 13 * * 0"    # 22:00 KST, Sunday catch-up
    - cron: "0 3 * * 2-6"   # 23:00 ET during EDT (previous weekday in ET)
    - cron: "0 4 * * 2-6"   # 23:00 ET during EST (previous weekday in ET)
    - cron: "0 2 * * 1"     # 22:00 ET Sunday during EDT
    - cron: "0 3 * * 1"     # 22:00 ET Sunday during EST
  workflow_dispatch:
    inputs:
      region:
        description: "Which market to run (KR = 코스피/코스닥, US = 나스닥)"
        required: true
        default: KR
        type: choice
        options: [KR, US]
      force:
        description: "Re-run even if this session already has rows"
        required: false
        default: false
        type: boolean

concurrency:
  # A delayed schedule overlapping the next one would have both runs racing on the
  # same rows. The backend refuses concurrent runs anyway, but stopping it here means
  # the second run doesn't burn a job slot to be told "already running".
  group: ai-prediction
  cancel-in-progress: false

env:
  BASE_URL: https://kospi-predictor.onrender.com

jobs:
  predict:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve region and slot
        id: region
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "region=${{ inputs.region }}" >> "$GITHUB_OUTPUT"
            echo "force=${{ inputs.force }}" >> "$GITHUB_OUTPUT"
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Which region and slot a scheduled run is for is decided by *which* cron
          # fired — matched against the literal strings in the `schedule:` block above,
          # so editing a cron expression there means editing it here too.
          case "${{ github.event.schedule }}" in
            "0 14 * * 1-5")            region=KR slot=weekday ;;
            "0 13 * * 0")              region=KR slot=sunday  ;;
            "0 3 * * 2-6"|"0 4 * * 2-6") region=US slot=weekday ;;
            "0 2 * * 1"|"0 3 * * 1")     region=US slot=sunday  ;;
            *)
              echo "::error::Unmapped schedule '${{ github.event.schedule }}' — add it to this case."
              exit 1
              ;;
          esac

          # Then confirm against the market's own wall clock, because the UTC cron pair
          # covering US DST means one of the two always lands an hour off: during EDT the
          # EST line fires at 22:00 ET on a weekday (and 00:00 ET on Saturday), during
          # EST the EDT line fires at 00:00/21:00 ET. Only the firing that matches the
          # intended local hour proceeds; the other exits here without touching the
          # service. This is what keeps Saturday out of the schedule entirely, and what
          # stops the forced Sunday run below from being done twice.
          case "$region" in
            KR) tz=Asia/Seoul ;;
            US) tz=America/New_York ;;
          esac
          dow=$(TZ=$tz date +%u)   # 1=Mon … 7=Sun
          hour=$(TZ=$tz date +%H)
          local_now=$(TZ=$tz date +'%Y-%m-%d %H:%M %a')

          skip=true
          if [ "$slot" = "weekday" ] && [ "$dow" -le 5 ] && [ "$hour" = "23" ]; then
            skip=false
          elif [ "$slot" = "sunday" ] && [ "$dow" -eq 7 ] && [ "$hour" = "22" ]; then
            skip=false
          fi

          # The Sunday slot must actually produce a run, and no new session has closed
          # since Friday — so `has_run` would skip it as "already ran". force=true is
          # what makes it re-collect and re-score that same session; the batch upserts
          # per (수집일자, 종목코드), so this refreshes Friday's rows rather than
          # appending a second set.
          force=false
          [ "$slot" = "sunday" ] && force=true

          echo "region=$region" >> "$GITHUB_OUTPUT"
          echo "force=$force" >> "$GITHUB_OUTPUT"
          echo "skip=$skip" >> "$GITHUB_OUTPUT"
          echo "region=$region slot=$slot force=$force skip=$skip (local $local_now, $tz)"
          if [ "$skip" = "true" ]; then
            echo "::notice::Off-slot firing for $region $slot at $local_now $tz — nothing to do."
          fi

      - name: Wake the service
        if: steps.region.outputs.skip != 'true'
        # Render can have the instance cold; a 60s cold start inside the batch request
        # would eat most of the timeout budget below. Waking it first (and tolerating
        # a failure here) keeps that cost out of the run itself.
        run: curl -fsS --max-time 90 "$BASE_URL/api/health" || true

      - name: Run prediction batch
        if: steps.region.outputs.skip != 'true'
        env:
          TOKEN: ${{ secrets.PREDICTION_BATCH_TOKEN }}
          REGION: ${{ steps.region.outputs.region }}
          FORCE: ${{ steps.region.outputs.force }}
        run: |
          set -euo pipefail
          if [ -z "$TOKEN" ]; then
            echo "::error::PREDICTION_BATCH_TOKEN secret is not set — the endpoint will reject this run."
            exit 1
          fi

          # Trigger, then poll — do not hold the connection for the whole run.
          #
          # This step used to POST with wait=true so its exit status reflected the
          # batch outcome. That worked only while the 60% layer was the in-process
          # heuristic and a region finished in ~30s. With Claude actually in the loop
          # a region takes minutes, and the edge proxy in front of the app closes an
          # idle request long before that: curl returned `(22) ... error: 522` while
          # the batch was still working. Polling keeps the same "step fails when the
          # batch failed" property without any long-lived connection.
          auth=(-H "Authorization: Bearer $TOKEN")
          status_url="$BASE_URL/api/prediction/run/status?region=$REGION"

          # The finished_at of whatever run this process last remembers. Everything
          # below waits for this value to *change* — without it, a previous run's
          # record would be mistaken for this one's the moment polling starts.
          before=$(curl -fsS --max-time 60 "${auth[@]}" "$status_url" | jq -r '.last_run.finished_at // "none"')

          curl -fsS --max-time 60 -X POST "${auth[@]}" \
            "$BASE_URL/api/prediction/run?region=$REGION&force=$FORCE" | jq -c '{region, status}'

          # 60 × 20s = 20 minutes. A full US roster at high effort is the long case;
          # the batch's own in-process lock means a run that somehow overruns this is
          # still finishing, not lost — the next poll cycle or the next cron picks the
          # result up from the database.
          for _ in $(seq 1 60); do
            sleep 20
            body=$(curl -fsS --max-time 60 "${auth[@]}" "$status_url") || continue
            running=$(echo "$body" | jq -r '.running')
            finished=$(echo "$body" | jq -r '.last_run.finished_at // "none"')
            [ "$running" = "false" ] && [ "$finished" != "$before" ] || continue

            echo "$body" | jq '.last_run | {status, reason, collect_date, predict_date, predict_weekday, saved, markets, grading, elapsed_seconds, warnings, error}'
            run_status=$(echo "$body" | jq -r '.last_run.status')
            saved=$(echo "$body" | jq -r '.last_run.saved // 0')
            # A "skipped" status is a success (the idempotency guard worked); an
            # "error" is the batch raising; and a run that saved zero rows without
            # being skipped means every stock failed collection. The first is green,
            # the other two are real failures the run log should show red.
            if [ "$run_status" = "error" ]; then
              echo "::error::Batch raised: $(echo "$body" | jq -r '.last_run.error')"
              exit 1
            fi
            if [ "$run_status" != "skipped" ] && [ "$saved" -eq 0 ]; then
              echo "::error::Batch reported status=$run_status but saved 0 rows."
              exit 1
            fi
            exit 0
          done

          echo "::error::Batch did not report a finished run within 20 minutes."
          exit 1
