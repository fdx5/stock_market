name: KOSPIMAP social publishing

on:
  schedule:
    - cron: "15 13,22 * * *" # 07:15 / 22:15 KST
    - cron: "0,40 7 * * 1-5" # 16:00 KST; 16:40 covers delayed CSAT close
    - cron: "7,27,47 * * * *" # Recover due posts even when earlier runs are delayed
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow action
        required: true
        type: choice
        default: preview
        options: [preview, verify, publish-current, catch-up]
      preview_date:
        description: "KST date to preview without publishing (YYYY-MM-DD)"
        required: false
        type: string
      edition:
        description: Edition to preview
        required: true
        type: choice
        options: [morning, evening, close]

permissions:
  contents: write # Append public PNGs to the separate social-post-assets branch.

concurrency:
  group: kospimap-social-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image and calendar dependencies
        run: |
          python -m pip install 'Pillow>=11,<13' 'playwright>=1.55,<2' 'exchange-calendars>=4.11,<5'
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          python -m playwright install --with-deps chromium
      - name: Prepare and deliver the edition
        env:
          BUFFER_PUBLISH_API_KEY: ${{ secrets.BUFFER_PUBLISH_API_KEY }}
          SOCIAL_PUBLISH_START: ${{ vars.SOCIAL_PUBLISH_START }}
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_MODE: ${{ inputs.mode }}
          PREVIEW_DATE: ${{ inputs.preview_date }}
          PREVIEW_EDITION: ${{ inputs.edition }}
        run: python scripts/social_publish.py
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
        with:
          name: social-publication-preview
          path: social-preview/
          if-no-files-found: error
