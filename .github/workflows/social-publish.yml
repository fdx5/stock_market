name: KOSPIMAP social publishing

on:
  schedule:
    - cron: "15 13,22 * * *" # 07:15 / 22:15 KST
    - cron: "0,40 7 * * 1-5" # 16:00 KST; 16:40 covers delayed CSAT close
    - cron: "0 23 * * *" # 08:00 KST global index scoreboard
    - cron: "30 0 * * 1-5" # 09:30 KST movers (early session)
    - cron: "40 3 * * 1-5" # 12:40 KST movers (midday)
    - cron: "15 7 * * 1-5" # 16:15 KST movers (close)
    - cron: "10 12 * * 1-5" # 21:10 KST NASDAQ-100 movers (pre-market)
    - cron: "50 15 * * 1-5" # 00:50 KST NASDAQ-100 movers (first hour)
    - cron: "50 21 * * 1-5" # 06:50 KST NASDAQ-100 movers (close)
    - cron: "0 8 * * *" # 17:00 KST global index scoreboard
    - cron: "7,27,47 * * * *" # Recover due posts even when earlier runs are delayed
  workflow_dispatch:
    inputs:
      mode:
        description: Workflow action
        required: true
        type: choice
        default: preview
        options: [preview, verify, publish-current, publish-update, catch-up, publish-prepared]
      prepared_path:
        description: "Verified public plan path on the social-post-assets branch"
        required: false
        type: string
      preview_date:
        description: "KST date to preview without publishing (YYYY-MM-DD)"
        required: false
        type: string
      edition:
        description: Edition to preview
        required: true
        type: choice
        options: [morning, evening, close, world_morning, world_evening, movers_open, movers_noon, movers_close, us_movers_pre, us_movers_open, us_movers_close]

permissions:
  contents: write # Append public PNGs to the separate social-post-assets branch.

concurrency:
  group: kospimap-social-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PNG validation
        run: python -m pip install 'Pillow>=11,<13'
      - name: Install browser and calendar dependencies
        if: ${{ inputs.mode != 'publish-prepared' && inputs.mode != 'verify' }}
        timeout-minutes: 6
        run: |
          python -m pip install 'playwright>=1.55,<2' 'exchange-calendars>=4.11,<5'
          python -m playwright install --with-deps chromium
          sudo apt-get install -y -q fonts-noto-cjk > /dev/null # Korean glyphs for page screenshots
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90 \
            --output "$RUNNER_TEMP/NotoSansCJKkr-Regular.otf" \
            https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Regular.otf
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 90             --output "$RUNNER_TEMP/NotoSansCJKkr-Bold.otf"             https://raw.githubusercontent.com/notofonts/noto-cjk/main/Sans/OTF/Korean/NotoSansCJKkr-Bold.otf
      - name: Prepare and deliver the edition
        env:
          BUFFER_PUBLISH_API_KEY: ${{ secrets.BUFFER_PUBLISH_API_KEY }}
          SOCIAL_PUBLISH_START: ${{ vars.SOCIAL_PUBLISH_START }}
          GITHUB_TOKEN: ${{ github.token }}
          SCHEDULE: ${{ github.event.schedule }}
          WORKFLOW_MODE: ${{ inputs.mode }}
          PREPARED_PATH: ${{ inputs.prepared_path }}
          SOCIAL_FONT: ${{ runner.temp }}/NotoSansCJKkr-Regular.otf
          SOCIAL_FONT_BOLD: ${{ runner.temp }}/NotoSansCJKkr-Bold.otf
          PREVIEW_DATE: ${{ inputs.preview_date }}
          PREVIEW_EDITION: ${{ inputs.edition }}
        run: python scripts/social_publish.py
      - uses: actions/upload-artifact@v4
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'preview' }}
        with:
          name: social-publication-preview
          path: social-preview/
          if-no-files-found: error
