name: Daily 08 and 16 KST investment videos

on:
  schedule:
    - cron: "0 23 * * *" # Every day at 08:00 Asia/Seoul, including weekends.
    - cron: "0 7 * * *" # Every day at 16:00 Asia/Seoul, including weekends.
    # GitHub may delay or drop scheduled runs; these retry a slot still under 20 videos.
    - cron: "25 23 * * *"
    - cron: "10 0 * * *"
    - cron: "10 1 * * *"
    - cron: "10 2 * * *"
    - cron: "25 7 * * *"
    - cron: "10 8 * * *"
    - cron: "10 9 * * *"
    - cron: "10 10 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - .github/workflows/editorial-refresh.yml
      - scripts/refresh_editorial.py
      - backend/app/data/editorial_sources.py
      - backend/app/services/editorial.py

permissions:
  contents: write # Append immutable public editions on the separate data branch.

concurrency:
  group: editorial-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        market: [kr, us]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install public-source collector dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Collect, append and verify today's edition
        env:
          EDITORIAL_REFRESH_TOKEN: ${{ secrets.EDITORIAL_REFRESH_TOKEN || secrets.PREDICTION_BATCH_TOKEN }}
          YOUTUBE_DATA_API_KEY: ${{ secrets.YOUTUBE_DATA_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/refresh_editorial.py ${{ matrix.market }}
