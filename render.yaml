services:
  - type: web
    name: kospi-predictor
    env: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      # Run the prediction batch's 60% Claude analysis on a Claude subscription via the
      # Claude Code CLI, not the metered API. Leave ANTHROPIC_API_KEY UNSET — if it is
      # set, ai_analyst still strips it for the CLI subprocess, but keeping it off the
      # service avoids any accidental metered calls elsewhere.
      - key: PREDICTION_AI_BACKEND
        value: subscription
      # Thinking depth, and the largest cost knob after the model itself — thinking
      # bills as output. "medium" is the code default; raise to "high"/"xhigh" only if
      # the scores visibly degrade. Every run now reports its token usage in the batch
      # summary and the admin panel, so that is a measurable question, not a guess.
      # - key: PREDICTION_AI_EFFORT
      #   value: medium
      # Set to "1" to have Claude write 장 마감 설명 instead of the deterministic
      # composer in prediction_quality. Off by default: it was ~20% of the generated
      # text to explain a move that already happened, from numbers this app holds.
      # - key: PREDICTION_AI_CLOSE_SUMMARY
      #   value: "1"
      # Long-lived subscription token from `claude setup-token` (run locally while
      # logged into Claude Code on a Pro/Max plan). Set as a secret in the dashboard.
      - key: CLAUDE_CODE_OAUTH_TOKEN
        sync: false
      # KakaoTalk "나에게 보내기" 방문자 통계 알림 (see app/services/kakao_notify.py
      # and .github/workflows/kakao-notify.yml). The refresh/access token itself is
      # not an env var — it lives in the Turso DB via kakao_token_store.py, seeded
      # once by scripts/kakao_get_refresh_token.py.
      - key: KAKAO_REST_API_KEY
        sync: false
      - key: KAKAO_CLIENT_SECRET
        sync: false
      - key: KAKAO_NOTIFY_TOKEN
        sync: false
      # Guards POST /api/global-top100/refresh, the nightly 글로벌 시가총액 TOP 100
      # full-snapshot rebuild trigger (see app/services/global_top100.py and
      # .github/workflows/global-top100-refresh.yml). Same shape as KAKAO_NOTIFY_TOKEN
      # above — must also be set as a GitHub Actions secret of the same name so that
      # workflow's curl call can authenticate. Leaving this unset just disables the
      # HTTP trigger (503); main.py's in-process scheduler still refreshes nightly
      # without it.
      - key: GLOBAL_TOP100_REFRESH_TOKEN
        sync: false
      # 종목별 예측 결과 메일 (app/services/prediction_mail.py, scripts/send_prediction_mail.py).
      #
      # Every setting below is now OPTIONAL here, and the admin panel's 메일 설정
      # drawer is the expected place to fill them in — it writes to the mail_config
      # table, which takes precedence over anything set on this page and applies to the
      # next send without a redeploy. See app/services/mail_config_store.py.
      #
      # They are kept declared because a `sync: false` entry is still the right way to
      # seed a fresh service, and because the table needs a database to live in: if
      # Turso is unreachable, these are what mail falls back to.
      #
      # Naver's SMTP needs POP3/SMTP switched on in 메일 환경설정, and an
      # 애플리케이션 비밀번호 rather than the account password on any 2FA-enabled
      # account. With neither transport configured the batch reports "not configured"
      # and sends nothing, which is the intended default — mail is opt-in.
      # Preferred transport: an API key scoped to sending, so no personal mailbox
      # credential has to live on this service. Set either this or the SMTP pair
      # below; with both, this wins (see prediction_mail.backend_name).
      - key: PREDICTION_MAIL_RESEND_KEY
        sync: false
      - key: PREDICTION_MAIL_SMTP_HOST
        value: smtp.naver.com
      - key: PREDICTION_MAIL_SMTP_PORT
        value: "587"
      - key: PREDICTION_MAIL_USER
        sync: false
      - key: PREDICTION_MAIL_PASSWORD
        sync: false
      - key: PREDICTION_MAIL_TO
        sync: false
