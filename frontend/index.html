    <script>
      // Runs before first paint so a returning light-theme visitor never sees a
      // flash of the dark default while the app JS is still loading. The js class
      // also hides the server-provided SEO shell before its first paint; React
      // replaces that shell, while no-JS crawlers still receive its full content.
      (function () {
        document.documentElement.classList.add("js");
        try {
          var stored = localStorage.getItem("site_theme");
          if (stored === "light") document.documentElement.setAttribute("data-theme", "light");
        } catch (e) {}
      })();
    </script>
    <script>
      // This guard lives in the HTML shell (not the bundled app) so it still runs
      // when a deploy removed the old hashed entry script before a returning tab
      // fetched the new index.html. In that failure mode the React error handlers
      // cannot run at all. Recover once with a cache-busting URL, then stop to avoid
      // reload loops during a genuine outage or while offline.
      (function () {
        var buildId = "__KSTOCK_BUILD_ID__";
        window.__KSTOCK_APP_BOOTED__ = false;
        var recoveryStarted = false;
        function recoverStaleBoot() {
          if (window.__KSTOCK_APP_BOOTED__ || recoveryStarted) return;
          recoveryStarted = true;
          try {
            var key = "kst_boot_recovered_" + buildId;
            if (localStorage.getItem(key) === "1") return;
            localStorage.setItem(key, "1");
          } catch (e) {}
          var next = new URL(window.location.href);
          next.searchParams.set("__fresh", String(Date.now()));
          window.location.replace(next.toString());
        }
        window.addEventListener("error", function (event) {
          var target = event.target;
          if (target && target.tagName === "SCRIPT") recoverStaleBoot();
        }, true);
        window.setTimeout(recoverStaleBoot, 7000);
      })();
    </script>

      html.js [data-seo-shell="true"] { visibility: hidden; }
